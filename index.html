<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProfessorFilou</title>

<link rel="icon" type="image/jpeg" href="ProfessorFilouLOGO.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    overflow-x:hidden;
    color:white;
    min-height:100vh;
}

canvas{
    position:fixed;
    inset:0;
    z-index:-1;
}

.main{
    width:100%;
    min-height:100vh;
    padding:60px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

h1{
    font-size:clamp(42px,8vw,100px);
    line-height:1;
    letter-spacing:clamp(1px,0.5vw,6px);
    text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc,0 0 40px #00ffcc;
    animation:glow 2s infinite alternate;
    max-width:100%;
    overflow-wrap:anywhere;
}

.line{
    width:min(320px,75vw);
    height:2px;
    background:#00ffcc;
    margin:22px auto;
    box-shadow:0 0 15px #00ffcc;
}

.text{
    color:#bfbfbf;
    line-height:1.8;
    font-size:clamp(16px,4vw,22px);
}

.socials{
    margin-top:38px;
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.social{
    width:74px;
    height:74px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.social:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.5);
}

.social img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.projects-title{
    margin-top:65px;
    font-size:clamp(26px,6vw,34px);
    color:#00ffcc;
    letter-spacing:2px;
}

.projects{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:16px;
    width:min(1100px,100%);
}

.project-btn{
    padding:18px 16px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
    backdrop-filter:blur(8px);
    font-size:17px;
}

.project-btn:hover{
    transform:translateY(-5px);
    border-color:#00ffcc;
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.4);
    color:#00ffcc;
}

.footer{
    margin-top:55px;
    color:#666;
    font-size:14px;
}

.footer-info{
    margin-top:14px;
    color:#777;
    font-size:13px;
    line-height:1.9;
}
.footer-info b{
    color:#00ffcc;
    font-weight:700;
}

@keyframes glow{
    from{text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc;}
    to{text-shadow:0 0 20px #00ffcc,0 0 40px #00ffcc,0 0 80px #00ffcc;}
}

/* ══ Konfetti ══ */
#confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
}
.confetti-piece{
    position:absolute;
    top:-20px;
    width:10px;
    height:14px;
    border-radius:2px;
    opacity:0.9;
    animation:conffall linear forwards;
}
@keyframes conffall{
    0%   { transform:translateY(-20px) rotate(0deg);   opacity:1; }
    100% { transform:translateY(105vh) rotate(720deg); opacity:1; }
}

/* ════ PRESENCE ════ */
#presence-fixed{
    position:fixed;
    top:24px;
    left:24px;
    z-index:300;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:7px 14px;
    backdrop-filter:blur(8px);
    font-size:13px;
    color:#bfbfbf;
    transition:box-shadow 0.6s ease, border-color 0.6s ease;
}

#presence-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#444;
    display:inline-block;
    flex-shrink:0;
    transition:background 0.6s ease;
}

@keyframes pulse-green{
    0%   { box-shadow:0 0 0 0 rgba(0,255,204,0.7); }
    70%  { box-shadow:0 0 0 7px rgba(0,255,204,0); }
    100% { box-shadow:0 0 0 0 rgba(0,255,204,0); }
}
@keyframes pulse-dim{
    0%   { box-shadow:0 0 0 0 rgba(120,120,120,0.4); }
    70%  { box-shadow:0 0 0 5px rgba(120,120,120,0); }
    100% { box-shadow:0 0 0 0 rgba(120,120,120,0); }
}

/* ════ GLÜHBIRNE (NEU) ════ */
#bulb-fixed {
    position: fixed;
    top: 0;
    right: 40px;
    z-index: 300;
}

@media(max-width:600px){
    #bulb-fixed { right: 20px; }
    #presence-fixed{ top:auto; bottom:20px; left:50%; transform:translateX(-50%); }
}

.bulb-hit {
    width: 60px;
    height: 130px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.bulb-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* --- Der AN-Zustand --- */
.bulb-svg.is-on #bulb-glass {
    fill: rgba(0, 255, 204, 0.2);
    stroke: #00ffcc;
    filter: drop-shadow(0 0 15px #00ffcc) drop-shadow(0 0 30px rgba(0,255,204,0.6));
}

.bulb-svg.is-on #bulb-filament {
    stroke: #fff;
    filter: drop-shadow(0 0 4px #00ffcc);
}

/* Wackeleffekt beim Klicken */
@keyframes swing {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(8deg); }
    40% { transform: rotate(-6deg); }
    60% { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
}
.swinging {
    transform-origin: 50% 0%;
    animation: swing 0.6s ease;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="confetti-layer"></div>

<div id="presence-fixed">
    <span id="presence-dot"></span>
    <span id="presence-count">–</span>
</div>

<div id="bulb-fixed">
    <div class="bulb-hit" id="hit-bulb">
        <svg class="bulb-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <line x1="50" y1="0" x2="50" y2="60" stroke="#666" stroke-width="3" />
            <rect x="40" y="60" width="20" height="15" rx="2" fill="#444" />
            <path id="bulb-filament" d="M45 100 Q45 85 50 85 Q55 85 55 100" stroke="#666" stroke-width="2" fill="none" />
            <path id="bulb-glass" d="M50 75 C25 75 25 120 50 130 C75 120 75 75 50 75 Z" fill="rgba(255,255,255,0.05)" stroke="#666" stroke-width="3" />
        </svg>
    </div>
</div>

<div class="main">

    <h1>ProfessorFilou</h1>
    <div class="line"></div>

    <div class="text">
        ❤️ Minecraft
    </div>

    <div class="socials">
        <a class="social" href="https://github.com/professorfilou" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg">
        </a>
        <a class="social" href="https://youtube.com/@professorfilou" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
        </a>
        <a class="social" href="https://twitch.tv/professorfilou" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg">
        </a>
    </div>

    <div class="projects-title">My Projects</div>

    <div class="projects">
        <a class="project-btn" href="https://professorfilou.de/BankingGame"   target="_blank">BankGame</a>
        <a class="project-btn" href="https://professorfilou.de/EmojiClick/"         target="_blank">EmojiClick</a>
        <a class="project-btn" href="https://professorfilou.de/DropDown/"            target="_blank">DropDown</a>
        <a class="project-btn" href="https://professorfilou.de/WhoAmIWeb/"          target="_blank">WhoAmIWeb</a>
        <a class="project-btn" href="https://professorfilou.de/WeatherWeb/"         target="_blank">WeatherWeb</a>
        <a class="project-btn" href="https://professorfilou.de/Tycoon/"              target="_blank">Tycoon</a>
        <a class="project-btn" href="https://professorfilou.de/finn.fun/"           target="_blank">finn.fun</a>
        <a class="project-btn" href="https://professorfilou.de/Lade/"                target="_blank">Lade</a>
        <a class="project-btn" href="https://professorfilou.de/Search/"              target="_blank">Search</a>
        <a class="project-btn" href="https://professorfilou.de/Quiz/"                target="_blank">Quiz</a>
        <a class="project-btn" href="https://professorfilou.de/FinnGPT/"             target="_blank">FinnGPT</a>
        <a class="project-btn" href="https://professorfilou.de/Pong/"                target="_blank">Pong</a>
        <a class="project-btn" href="https://professorfilou.de/Windows/"             target="_blank">Windows</a>
        <a class="project-btn" href="https://professorfilou.de/Terminal/"            target="_blank">Terminal</a>
        <a class="project-btn" href="https://professorfilou.de/SportRules"           target="_blank">SportRules</a>
    </div>

    <div class="footer">© ProfessorFilou</div>
    <div class="footer-info">
        👀 <b id="visit-count">…</b> Besuche<br>
        🎂 Seite ist <b id="site-age">…</b> online
    </div>

</div>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue, set, onDisconnect }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCAh2AsbxLqU2Gx9s0YbZo8PR4fpG3WDw8",
    authDomain:        "professorfilou-e8eea.firebaseapp.com",
    databaseURL:       "https://professorfilou-e8eea-default-rtdb.firebaseio.com",
    projectId:         "professorfilou-e8eea",
    storageBucket:     "professorfilou-e8eea.firebasestorage.app",
    messagingSenderId: "280418084891",
    appId:             "1:280418084891:web:1750e554b152810033f0be"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);


/* ═══════════════ BESUCHERZÄHLER ═══════════════ */
const SITE_BORN = new Date("2026-05-31T00:00:00");
const visitsRef = ref(db, "visits/total");
const visitEl   = document.getElementById("visit-count");

runTransaction(visitsRef, cur => (cur || 0) + 1);
onValue(visitsRef, snap => {
    visitEl.textContent = (snap.val() || 0).toLocaleString("de-DE");
});

function updateAge() {
    const days  = Math.floor((new Date() - SITE_BORN) / 86400000);
    const ageEl = document.getElementById("site-age");
    if      (days < 0)  ageEl.textContent = "bald";
    else if (days === 0) ageEl.textContent = "seit heute";
    else if (days === 1) ageEl.textContent = "1 Tag";
    else                 ageEl.textContent = days + " Tage";
}
updateAge();

function launchConfetti(amount = 80) {
    const layer = document.getElementById("confetti-layer");
    const colors = ["#00ffcc","#f06292","#fff176","#66bb6a","#42a5f5","#ffffff"];
    for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left             = Math.random() * 100 + "vw";
        piece.style.background       = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration= (2.5 + Math.random() * 2) + "s";
        piece.style.animationDelay   = (Math.random() * 0.6) + "s";
        layer.appendChild(piece);
        piece.addEventListener("animationend", () => piece.remove());
    }
}

const today = new Date();
if (today.getDate() === 31 && today.getMonth() === 4) {
    setTimeout(() => launchConfetti(160), 600);
    setTimeout(() => launchConfetti(160), 1800);
}


/* ═══════════════ LIVE PRESENCE ═══════════════ */
const sessionId    = Math.random().toString(36).slice(2);
const sessionRef   = ref(db, "presence/" + sessionId);
const connectedRef = ref(db, ".info/connected");
const presenceRef  = ref(db, "presence");

const dot          = document.getElementById("presence-dot");
const countEl      = document.getElementById("presence-count");
const widget       = document.getElementById("presence-fixed");

onValue(connectedRef, snap => {
    if (!snap.val()) return;
    onDisconnect(sessionRef).remove();
    set(sessionRef, { t: Date.now() });
});

onValue(presenceRef, snap => {
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;

    if (count <= 1) {
        countEl.textContent  = "nur du hier";
        dot.style.background = "#666";
        dot.style.animation  = "pulse-dim 2.5s ease infinite";
        widget.style.borderColor  = "rgba(255,255,255,0.08)";
        widget.style.boxShadow    = "none";
    } else if (count <= 3) {
        countEl.textContent  = count + " gerade hier";
        dot.style.background = "#00ffcc";
        dot.style.animation  = "pulse-green 1.8s ease infinite";
        widget.style.borderColor = "rgba(0,255,204,0.3)";
        widget.style.boxShadow   = "0 0 12px rgba(0,255,204,0.15)";
    } else {
        countEl.textContent  = count + " gerade hier 🔥";
        dot.style.background = "#00ffcc";
        dot.style.animation  = "pulse-green 0.9s ease infinite";
        widget.style.borderColor = "rgba(0,255,204,0.6)";
        widget.style.boxShadow   = "0 0 20px rgba(0,255,204,0.35)";
    }
});


/* ═══════════════ LIVE GLÜHBIRNE (NEU) ═══════════════ */
const bulbRef = ref(db, "live_features/light_bulb");
const bulbEl = document.getElementById("hit-bulb");
const bulbSvg = bulbEl.querySelector(".bulb-svg");

let currentBulbState = false;

onValue(bulbRef, (snap) => {
    currentBulbState = snap.val() === true;
    if (currentBulbState) {
        bulbSvg.classList.add("is-on");
    } else {
        bulbSvg.classList.remove("is-on");
    }
});

bulbEl.addEventListener("click", () => {
    bulbSvg.classList.remove("swinging");
    void bulbSvg.offsetWidth; 
    bulbSvg.classList.add("swinging");
    
    set(bulbRef, !currentBulbState);
});
</script>

<script>
const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() {
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x:  Math.random() * innerWidth,
        y:  Math.random() * innerHeight,
        r:  Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.45,
        dy: (Math.random() - 0.5) * 0.45,
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle   = "#00ffcc";
        ctx.shadowBlur  = 12;
        ctx.shadowColor = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
