    box-sizing:border-box;

body{

}

canvas{

    z-index:-1;
}

.main{

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid rgba(255,255,255,0.08);

.social:hover{

    box-shadow: 0 0 15px #00ffcc, 0 0 35px rgba(0,255,204,0.5);

.social img{

}

    letter-spacing:2px;
}

    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap:16px;
    width:min(1100px, 100%);
}

.project-btn{
    padding:18px 16px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);

.project-btn:hover{

.footer{
    margin-top:55px;

@keyframes glow{
    from{ text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
    to  { text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc, 0 0 80px #00ffcc; }
}

/* ============================================================
   EASTER EGG – PLANT (top right, fixed)
   ============================================================ */

#plant-zone {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80px;
}

/* ---- the clickable plant ---- */
#plant-hit {
    cursor: pointer;
    user-select: none;
    position: relative;
    width: 80px;
    height: 90px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

#plant-svg {
    width: 70px;
    height: 88px;
    overflow: visible;
    transition: filter 0.3s;
}

#plant-hit:hover #plant-svg {
    filter: drop-shadow(0 0 7px #00ffcc) drop-shadow(0 0 16px rgba(0,255,204,0.45));
}

/* water drop */
.wdrop {
    position: absolute;
    font-size: 20px;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    animation: wfall 0.8s ease-in forwards;
}

@keyframes wfall {
    0%   { opacity: 1; top: -4px; }
    75%  { opacity: 1; top: 68px; }
    100% { opacity: 0; top: 80px; }
}

/* bounce */
@keyframes pbounce {
    0%   { transform: scale(1)    rotate(0deg); }
    35%  { transform: scale(1.18) rotate(-7deg); }
    65%  { transform: scale(0.93) rotate(4deg); }
    100% { transform: scale(1)    rotate(0deg); }
}

.bouncing { animation: pbounce 0.45s ease; }

/* ---- message below plant ---- */
#plant-msg {
    margin-top: 6px;
    background: rgba(5,5,5,0.88);
    border: 1px solid #00ffcc;
    border-radius: 12px;
    padding: 7px 11px;
    color: #00ffcc;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 0 14px rgba(0,255,204,0.25);
    backdrop-filter: blur(8px);

    /* hidden by default, revealed after first water */
    opacity: 0;
    transform: translateY(-4px) scale(0.92);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
}

#plant-msg.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

#plant-msg strong {
    display: block;
    font-size: 15px;
}

/* leaf grow transition */
.leaf-el {
    transition: opacity 0.6s ease;
}

</style>

<!-- ======= FIREBASE ======= -->
<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCAh2AsbxLqU2Gx9s0YbZo8PR4fpG3WDw8",
    authDomain:        "professorfilou-e8eea.firebaseapp.com",
    databaseURL:       "https://professorfilou-e8eea-default-rtdb.firebaseio.com",
    projectId:         "professorfilou-e8eea",
    storageBucket:     "professorfilou-e8eea.firebasestorage.app",
    messagingSenderId: "280418084891",
    appId:             "1:280418084891:web:1750e554b152810033f0be"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

function todayKey() {
    return "plant_" + new Date().toISOString().slice(0, 10);
}

const plantRef = ref(db, "easter_egg/" + todayKey());

/* ---- DOM ---- */
const plantHit = document.getElementById("plant-hit");
const plantMsg = document.getElementById("plant-msg");
const pmCount  = document.getElementById("pm-count");
const pmText   = document.getElementById("pm-text");
const stem     = document.getElementById("p-stem");

const leaves = {
    l1: document.getElementById("p-l1"),
    l2: document.getElementById("p-l2"),
    l3: document.getElementById("p-l3"),
    l4: document.getElementById("p-l4"),
    l5: document.getElementById("p-l5"),
    l6: document.getElementById("p-l6"),
    flower: document.getElementById("p-flower"),
    fcore:  document.getElementById("p-fcore"),
};

let waterCount = 0;
let cooling    = false;

/* ---- Live sync from Firebase ---- */
onValue(plantRef, snap => {
    waterCount = snap.val() || 0;
    applyGrowth(waterCount);
    if (waterCount > 0) updateMsg(waterCount);
});

/* ---- Click: water once ---- */
plantHit.addEventListener("click", () => {
    if (cooling) return;
    cooling = true;
    setTimeout(() => cooling = false, 800);

    // write to Firebase → onValue fires → applyGrowth + updateMsg
    runTransaction(plantRef, cur => (cur || 0) + 1);

    spawnDrop();
    bounce();
});

/* ---- Growth stages ---- */
function applyGrowth(n) {

    // Stage 1 – base leaves (0 → 4): go from 40% to full
    const s1 = Math.min(1, n / 4);
    leaves.l1.setAttribute("opacity", 0.4 + s1 * 0.6);
    leaves.l2.setAttribute("opacity", 0.4 + s1 * 0.6);

    // Stage 2 – mid leaves (5 → 11)
    const s2 = Math.max(0, Math.min(1, (n - 4) / 7));
    leaves.l3.setAttribute("opacity", s2);
    leaves.l4.setAttribute("opacity", s2);

    // Stage 3 – top leaves + stem grows (12 → 19)
    const s3 = Math.max(0, Math.min(1, (n - 11) / 8));
    leaves.l5.setAttribute("opacity", s3);
    leaves.l6.setAttribute("opacity", s3);
    if (n >= 12) stem.setAttribute("y2", "30");   // stem stretches up

    // Stage 4 – flower (20+)
    const s4 = Math.max(0, Math.min(1, (n - 19) / 5));
    leaves.flower.setAttribute("opacity", s4);
    leaves.fcore.setAttribute("opacity",  s4);
}

/* ---- Message ---- */
function updateMsg(n) {
    pmCount.textContent = n + "×";

    if      (n === 1)  pmText.textContent = "heute gegossen 💧";
    else if (n < 5)    pmText.textContent = "heute gegossen 💧";
    else if (n < 15)   pmText.textContent = "heute gegossen – danke! 🌿";
    else if (n < 30)   pmText.textContent = "Pflanzenfan detected 🌳";
    else               pmText.textContent = "BITTE AUFHÖREN 😭💦";

    plantMsg.classList.add("visible");
}

/* ---- Water drop ---- */
function spawnDrop() {
    const d = document.createElement("div");
    d.className   = "wdrop";
    d.textContent = "💧";
    plantHit.appendChild(d);
    d.addEventListener("animationend", () => d.remove());
}

/* ---- Bounce ---- */
function bounce() {
    const svg = document.getElementById("plant-svg");
    svg.classList.remove("bouncing");
    void svg.offsetWidth;
    svg.classList.add("bouncing");
    svg.addEventListener("animationend", () => svg.classList.remove("bouncing"), { once: true });
}

</script>


<!-- ======= CANVAS BG ======= -->
<script>

const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() {
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x:  Math.random() * innerWidth,
        y:  Math.random() * innerHeight,
        r:  Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.45,
        dy: (Math.random() - 0.5) * 0.45,
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle   = "#00ffcc";
        ctx.shadowBlur  = 12;
        ctx.shadowColor = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();

</script>
