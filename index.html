<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProfessorFilou Homepage</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      overflow:hidden;
      height:100vh;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-1;
    }

    .center{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
    }

    h1{
      font-size:72px;
      letter-spacing:4px;
      text-transform:uppercase;
      text-shadow:
      0 0 10px #00ffcc,
      0 0 20px #00ffcc,
      0 0 40px #00ffcc;
      animation: glow 2s infinite alternate;
    }

    p{
      margin-top:15px;
      color:#aaaaaa;
      font-size:18px;
      letter-spacing:2px;
    }

    .line{
      width:300px;
      height:2px;
      background:#00ffcc;
      margin:25px auto;
      box-shadow:0 0 15px #00ffcc;
    }

    @keyframes glow{
      from{
        text-shadow:
        0 0 10px #00ffcc,
        0 0 20px #00ffcc;
      }
      to{
        text-shadow:
        0 0 20px #00ffcc,
        0 0 40px #00ffcc,
        0 0 60px #00ffcc;
      }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="center">
  <h1>ProfessorFilou</h1>
  <div class="line"></div>
  <p>WELCOME TO THE HOMEPAGE</p>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];

for(let i=0;i<120;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    dx:(Math.random()-0.5)*0.5,
    dy:(Math.random()-0.5)*0.5
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of particles){
    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0 || p.x>canvas.width) p.dx*=-1;
    if(p.y<0 || p.y>canvas.height) p.dy*=-1;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="#00ffcc";
    ctx.fill();
  }

  requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
