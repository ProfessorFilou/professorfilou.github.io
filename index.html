/* ════════════════════════════════
   PLANT EASTER EGG
   Desktop  → top-right fixed
   Mobile   → inline after footer
   ════════════════════════════════ */

#plant-fixed {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
}

@media (max-width: 600px) {
    #plant-fixed { display: none; }
}

#plant-inline {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 28px;
}

@media (max-width: 600px) {
    #plant-inline { display: flex; }
}

.plant-hit {
    position: relative;
    width: 68px;
    height: 84px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transition: filter 0.3s, opacity 0.5s ease, transform 0.5s ease;
}

.plant-hit:hover .plant-svg,
.plant-hit:active .plant-svg {
    filter: drop-shadow(0 0 8px #00ffcc) drop-shadow(0 0 18px rgba(0,255,204,0.4));
}

.wdrop {
    position: absolute;
    font-size: 18px;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    animation: wfall 0.72s cubic-bezier(.38,0,.62,1) forwards;
}

@keyframes wfall {
    0%   { opacity:1; top: 2px; }
    72%  { opacity:1; top: 70px; }
    100% { opacity:0; top: 80px; }
}

@keyframes pbounce {
    0%   { transform:scale(1) rotate(0deg); }
    28%  { transform:scale(1.18) rotate(-7deg); }
    58%  { transform:scale(0.93) rotate(4deg); }
    78%  { transform:scale(1.04) rotate(-2deg); }
    100% { transform:scale(1) rotate(0deg); }
}
.bouncing { animation: pbounce 0.48s ease; }

/* ── ERTRINKEN: Pflanze welkt und verschwindet ── */
@keyframes pdrown {
    0%   { transform: scale(1) rotate(0deg);   opacity:1; }
    20%  { transform: scale(1.05) rotate(3deg); opacity:1; }
    45%  { transform: scale(0.9) rotate(-8deg) translateY(6px); opacity:0.85; }
    70%  { transform: scale(0.75) rotate(14deg) translateY(18px); opacity:0.45; }
    100% { transform: scale(0.6) rotate(22deg) translateY(34px);  opacity:0; }
}
.drowning { animation: pdrown 1.3s cubic-bezier(.5,0,.7,1) forwards; }

/* ── NEUGEBURT: neue Pflanze sprießt ── */
@keyframes psprout {
    0%   { transform: scale(0.2) translateY(20px); opacity:0; }
    40%  { transform: scale(1.15) translateY(-4px); opacity:1; }
    65%  { transform: scale(0.95) translateY(2px); }
    100% { transform: scale(1) translateY(0); opacity:1; }
}
.sprouting { animation: psprout 1.1s cubic-bezier(.34,1.56,.64,1) forwards; }

.lf { transition: opacity 0.65s ease; }

#plant-toast {
    position: fixed;
    z-index: 400;
    top: 112px;
    right: 12px;
    left: auto;
    background: rgba(3,16,12,0.94);
    border: 1px solid rgba(0,255,204,0.45);
    border-radius: 14px;
    padding: 9px 15px;
    color: #00ffcc;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    white-space: nowrap;
    backdrop-filter: blur(16px);
    box-shadow:
        0 0 0 1px rgba(0,255,204,0.06),
        0 8px 28px rgba(0,0,0,0.55),
        0 0 20px rgba(0,255,204,0.12);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px) scale(0.94);
    transition: opacity 0.28s, transform 0.28s;
}

#plant-toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

@media (max-width: 600px) {
    #plant-toast {
        position: absolute;
        top: auto;
        right: auto;
        left: 50%;
        bottom: calc(100% + 10px);
        transform: translateX(-50%) translateY(6px) scale(0.94);
        font-size: 13px;
        white-space: nowrap;
    }
    #plant-toast.show {
        transform: translateX(-50%) translateY(0) scale(1);
    }
}

#plant-toast strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

#plant-toast .tsub {
    color: rgba(0,255,204,0.65);
    font-size: 11.5px;
}

.stage-pop {
    position: fixed;
    z-index: 500;
    color: #00ffcc;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 8px #00ffcc;
    animation: stagefloat 1.2s ease forwards;
}

@keyframes stagefloat {
    0%   { opacity:0; transform:translateY(0) translateX(-50%); }
    15%  { opacity:1; }
    70%  { opacity:1; transform:translateY(-18px) translateX(-50%); }
    100% { opacity:0; transform:translateY(-28px) translateX(-50%); }
}

/* ══ EASTER EGG: Emoji-Tier bei Inaktivität ══ */

    user-select:none;
    -webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 0 10px rgba(0,255,204,0.5));
    display:none;
}

</style>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCAh2AsbxLqU2Gx9s0YbZo8PR4fpG3WDw8",
    authDomain:        "professorfilou-e8eea.firebaseapp.com",
    databaseURL:       "https://professorfilou-e8eea-default-rtdb.firebaseio.com",
    projectId:         "professorfilou-e8eea",
    storageBucket:     "professorfilou-e8eea.firebasestorage.app",
    messagingSenderId: "280418084891",
    appId:             "1:280418084891:web:1750e554b152810033f0be"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

function todayKey() {
    return "plant_" + new Date().toISOString().slice(0, 10);
}

const plantRef = ref(db, "easter_egg/" + todayKey());

/* DOM */
const hitDesktop = document.getElementById("hit-desktop");
const hitMobile  = document.getElementById("hit-mobile");
const toast      = document.getElementById("plant-toast");
const ptNum      = document.getElementById("pt-num");
const ptSub      = document.getElementById("pt-sub");
const stem       = document.getElementById("p-stem");
const flower     = document.getElementById("p-flower");

const lf = id => document.getElementById(id);

const DROWN_AT = 100;   // ertrinkt bei 100×

let waterCount = 0;
let prevStage  = 0;
let cooling    = false;
let toastTimer = null;
let everClicked = false;
let drownPlayed = false;

/* ── Live Firebase ── */
onValue(plantRef, snap => {
    waterCount = snap.val() || 0;

    if (waterCount >= DROWN_AT && !drownPlayed) {
        drownPlayed = true;
        playDrownAndRebirth();
        if (everClicked) showToast(waterCount);
        return;
    }

    if (waterCount < DROWN_AT) {
        drownPlayed = false;
        applyGrowth(waterCount);
    }

    if (everClicked) showToast(waterCount);
});

/* ── Clicks ── */
[hitDesktop, hitMobile].forEach(el => {
    el.addEventListener("click", () => {
        if (cooling) return;
        cooling = true;
        setTimeout(() => cooling = false, 700);

        everClicked = true;
        runTransaction(plantRef, cur => {
            const next = (cur || 0) + 1;
            return next > DROWN_AT ? 0 : next;   // ab 100 zurück auf 0 (neue Pflanze)
        });
        spawnDrop(el);
        bounce(el);
    });
});

/* ── Growth (auf 100 skaliert) ──
   Stage 1 Basisblätter : 0  – 24
   Stage 2 mittlere      : 25 – 54
   Stage 3 obere + Stiel : 55 – 84
   Stage 4 Blüte         : 85 – 99
   100× = ertrinkt
*/
function stageOf(n) {
    if (n >= 85) return 4;
    if (n >= 55) return 3;
    if (n >= 25) return 2;
    return 1;
}

function applyGrowth(n) {
    const stage = stageOf(n);

    const s1 = Math.min(1, n / 24);
    lf("p-l1").setAttribute("opacity", 0.38 + s1 * 0.62);
    lf("p-l2").setAttribute("opacity", 0.38 + s1 * 0.62);

    const s2 = Math.max(0, Math.min(1, (n - 24) / 30));
    lf("p-l3").setAttribute("opacity", s2);
    lf("p-l4").setAttribute("opacity", s2);

    const s3 = Math.max(0, Math.min(1, (n - 54) / 30));
    lf("p-l5").setAttribute("opacity", s3);
    lf("p-l6").setAttribute("opacity", s3);
    if (n >= 55) stem.setAttribute("y2", "26");
    else         stem.setAttribute("y2", "40");

    const s4 = Math.max(0, Math.min(1, (n - 84) / 15));
    flower.setAttribute("opacity", s4);

    if (stage > prevStage && prevStage > 0) flashStage(stage);
    prevStage = stage;
}

function resetPlantVisual() {
    lf("p-l1").setAttribute("opacity", 0.42);
    lf("p-l2").setAttribute("opacity", 0.42);
    lf("p-l3").setAttribute("opacity", 0);
    lf("p-l4").setAttribute("opacity", 0);
    lf("p-l5").setAttribute("opacity", 0);
    lf("p-l6").setAttribute("opacity", 0);
    flower.setAttribute("opacity", 0);
    stem.setAttribute("y2", "40");
    prevStage = 1;
}

/* ── Ertrinken + Neugeburt ── */
function playDrownAndRebirth() {
    [hitDesktop, hitMobile].forEach(el => {
        const svg = el.querySelector(".plant-svg");

        svg.classList.remove("bouncing", "sprouting");
        void svg.offsetWidth;
        svg.classList.add("drowning");

        svg.addEventListener("animationend", function onDrown() {
            svg.removeEventListener("animationend", onDrown);

            resetPlantVisual();
            svg.classList.remove("drowning");
            void svg.offsetWidth;
            svg.classList.add("sprouting");

            svg.addEventListener("animationend", function onSprout() {
                svg.removeEventListener("animationend", onSprout);
                svg.classList.remove("sprouting");
            }, { once: true });
        }, { once: true });
    });

    flashCustom("💀 ERTRUNKEN → 🌱 NEU!");
}

const stageText = { 2:"🌿 Neue Blätter!", 3:"🌱 Sie wächst!", 4:"🌸 Geblüht!" };

function flashStage(s) {
    if (!stageText[s]) return;
    flashCustom(stageText[s]);
}

function flashCustom(txt) {
    const isMobile = window.innerWidth <= 600;
    const anchor   = isMobile ? hitMobile : hitDesktop;
    const rect     = anchor.getBoundingClientRect();

    const el = document.createElement("div");
    el.className   = "stage-pop";
    el.textContent = txt;
    el.style.left  = (rect.left + rect.width / 2) + "px";
    el.style.top   = (rect.top - 4) + "px";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
}

/* ── Toast ── */
function showToast(n) {
    clearTimeout(toastTimer);
    ptNum.textContent = n + "×";

    if      (n >= DROWN_AT) ptSub.textContent = "sie ist ertrunken 💀🌊";
    else if (n < 25)        ptSub.textContent = "heute gegossen 💧";
    else if (n < 55)        ptSub.textContent = "schon " + n + "× – danke! 🌿";
    else if (n < 85)        ptSub.textContent = "echter Pflanzenfan 🌳";
    else                    ptSub.textContent = "fast zu viel Wasser 😅💦";

    if (window.innerWidth <= 600) {
        const inlineEl = document.getElementById("plant-inline");
        inlineEl.style.position = "relative";
        toast.style.position    = "absolute";
        if (toast.parentElement !== inlineEl) {
            inlineEl.appendChild(toast);
        }
    }

    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}

/* ── Drop ── */
function spawnDrop(anchor) {
    const d = document.createElement("div");
    d.className   = "wdrop";
    d.textContent = "💧";
    anchor.appendChild(d);
    d.addEventListener("animationend", () => d.remove());
}

/* ── Bounce ── */
function bounce(anchor) {
    const svg = anchor.querySelector(".plant-svg");
    if (svg.classList.contains("drowning") || svg.classList.contains("sprouting")) return;
    svg.classList.remove("bouncing");
    void svg.offsetWidth;
    svg.classList.add("bouncing");
    svg.addEventListener("animationend",
        () => svg.classList.remove("bouncing"), { once: true });
}

</script>


<!-- ══ EASTER EGG: Emoji-Tier bei Inaktivität ══ -->
<script>
(function(){
    const critter = document.getElementById("critter");
    const animals = ["🐢","🐱","🦊","🐸","🐰","🦫","🐧","🦆","🐌","🦔"];
    const IDLE_MS = 30000;   // 30 Sekunden

    let idleTimer = null;
    let active    = false;
    let rafId     = null;
    let x = 0, y = 0;
    let speed = 1.6;
    let scared = false;

    function resetIdle(){
        clearTimeout(idleTimer);
        if(!active){
            idleTimer = setTimeout(spawnCritter, IDLE_MS);
        }
    }

    function spawnCritter(){
        active  = true;
        scared  = false;
        speed   = 1.6;
        critter.textContent = animals[Math.floor(Math.random()*animals.length)];

        y = 60 + Math.random() * (window.innerHeight - 160);
        x = -120;
        critter.style.top  = y + "px";
        critter.style.left = x + "px";
        critter.style.transform = "scaleX(1)";
        critter.style.display = "block";

        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(walk);
    }

    function walk(){
        x += speed;
        critter.style.left = x + "px";

        if(x > window.innerWidth + 140){
            despawn();
            return;
        }
        rafId = requestAnimationFrame(walk);
    }

    function despawn(){
        cancelAnimationFrame(rafId);
        critter.style.display = "none";
        active = false;
        resetIdle();
    }

    // Anklicken/antippen → erschrecken und rausrennen
    critter.addEventListener("click", () => {
        if(scared) return;
        scared = true;
        speed  = 14;
        critter.style.transform = "scaleX(1.3) rotate(-8deg)";
    });

    // Jede Nutzeraktion setzt den Idle-Timer zurück
    ["mousemove","mousedown","keydown","scroll","touchstart","wheel"]
        .forEach(ev => window.addEventListener(ev, resetIdle, {passive:true}));

    window.addEventListener("resize", () => {
        if(active && y > window.innerHeight - 80){
            y = window.innerHeight - 100;
            critter.style.top = y + "px";
        }
    });

    resetIdle();
})();
</script>


<!-- ══ CANVAS ══ -->
<script>
const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() {
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x:  Math.random() * innerWidth,
        y:  Math.random() * innerHeight,
        r:  Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.45,
        dy: (Math.random() - 0.5) * 0.45,
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle   = "#00ffcc";
        ctx.shadowBlur  = 12;
        ctx.shadowColor = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
