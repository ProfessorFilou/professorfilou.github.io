<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProfessorFilou</title>

<link rel="icon" type="image/jpeg" href="ProfessorFilouLOGO.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    overflow-x:hidden;
    color:white;
    min-height:100vh;
}

canvas{
    position:fixed;
    inset:0;
    z-index:-1;
}

.main{
    width:100%;
    min-height:100vh;
    padding:60px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

h1{
    font-size:clamp(42px,8vw,100px);
    line-height:1;
    letter-spacing:clamp(1px,0.5vw,6px);
    text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc,0 0 40px #00ffcc;
    animation:glow 2s infinite alternate;
    max-width:100%;
    overflow-wrap:anywhere;
}

.line{
    width:min(320px,75vw);
    height:2px;
    background:#00ffcc;
    margin:22px auto;
    box-shadow:0 0 15px #00ffcc;
}

.text{
    color:#bfbfbf;
    line-height:1.8;
    font-size:clamp(16px,4vw,22px);
}

.socials{
    margin-top:38px;
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.social{
    width:74px;
    height:74px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.social:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.5);
}

.social img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.projects-title{
    margin-top:65px;
    font-size:clamp(26px,6vw,34px);
    color:#00ffcc;
    letter-spacing:2px;
}

.projects{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:16px;
    width:min(1100px,100%);
}

.project-btn{
    padding:18px 16px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
    backdrop-filter:blur(8px);
    font-size:17px;
}

.project-btn:hover{
    transform:translateY(-5px);
    border-color:#00ffcc;
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.4);
    color:#00ffcc;
}

.footer{
    margin-top:55px;
    color:#666;
    font-size:14px;
}

.footer-info{
    margin-top:14px;
    color:#777;
    font-size:13px;
    line-height:1.9;
}
.footer-info b{
    color:#00ffcc;
    font-weight:700;
}

@keyframes glow{
    from{text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc;}
    to{text-shadow:0 0 20px #00ffcc,0 0 40px #00ffcc,0 0 80px #00ffcc;}
}

/* ══ Konfetti ══ */
#confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
}
.confetti-piece{
    position:absolute;
    top:-20px;
    width:10px;
    height:14px;
    border-radius:2px;
    opacity:0.9;
    animation:conffall linear forwards;
}
@keyframes conffall{
    0%   { transform:translateY(-20px) rotate(0deg);   opacity:1; }
    100% { transform:translateY(105vh) rotate(720deg); opacity:1; }
}

/* ════ PRESENCE ════ */
#presence-fixed{
    position:fixed;
    top:24px;
    left:24px;
    z-index:300;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:7px 14px;
    backdrop-filter:blur(8px);
    font-size:13px;
    color:#bfbfbf;
    transition:box-shadow 0.6s ease, border-color 0.6s ease;
}

#presence-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#444;
    display:inline-block;
    flex-shrink:0;
    transition:background 0.6s ease;
}

@keyframes pulse-green{
    0%   { box-shadow:0 0 0 0 rgba(0,255,204,0.7); }
    70%  { box-shadow:0 0 0 7px rgba(0,255,204,0); }
    100% { box-shadow:0 0 0 0 rgba(0,255,204,0); }
}
@keyframes pulse-dim{
    0%   { box-shadow:0 0 0 0 rgba(120,120,120,0.4); }
    70%  { box-shadow:0 0 0 5px rgba(120,120,120,0); }
    100% { box-shadow:0 0 0 0 rgba(120,120,120,0); }
}

/* ════ GLÜHBIRNE ════ */
#bulb-fixed {
    position: fixed;
    top: 0;
    right: 40px;
    z-index: 300;
}

@media(max-width:600px){
    #bulb-fixed { right: 20px; }
}

.bulb-hit {
    width: 60px;
    height: 130px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.bulb-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.bulb-svg.is-on #bulb-glass {
    fill: rgba(0, 255, 204, 0.2);
    stroke: #00ffcc;
    filter: drop-shadow(0 0 15px #00ffcc) drop-shadow(0 0 30px rgba(0,255,204,0.6));
}

.bulb-svg.is-on #bulb-filament {
    stroke: #fff;
    filter: drop-shadow(0 0 4px #00ffcc);
}

@keyframes swing {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(8deg); }
    40% { transform: rotate(-6deg); }
    60% { transform: rotate(3deg); }
    100% { transform: rotate(0deg); }
}
.swinging {
    transform-origin: 50% 0%;
    animation: swing 0.6s ease;
}

/* ════ PFLANZE (UNTEN RECHTS FIXIERT) ════ */
#plant-fixed{
    position:fixed;
    bottom:24px;
    right:24px;
    z-index:300;
    display:flex;
    flex-direction:column;
    align-items:center;
}

@media(max-width:600px){
    #plant-fixed{ display:none; }
    #presence-fixed{ top:auto; bottom:20px; left:50%; transform:translateX(-50%); }
}

#plant-inline{
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:28px;
}

@media(max-width:600px){
    #plant-inline{ display:flex; }
}

.plant-hit{
    position:relative;
    width:68px;
    height:84px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.plant-svg{
    width:100%;
    height:100%;
    overflow:visible;
    transition:filter 0.3s, opacity 0.5s ease, transform 0.5s ease;
}

.plant-hit:hover .plant-svg,
.plant-hit:active .plant-svg{
    filter:drop-shadow(0 0 8px #00ffcc) drop-shadow(0 0 18px rgba(0,255,204,0.4));
}

.wdrop{
    position:absolute;
    font-size:18px;
    top:2px;
    left:50%;
    transform:translateX(-50%);
    pointer-events:none;
    animation:wfall 0.72s cubic-bezier(.38,0,.62,1) forwards;
}

@keyframes wfall{
    0%  { opacity:1; top:2px; }
    72% { opacity:1; top:70px; }
    100%{ opacity:0; top:80px; }
}

@keyframes pbounce{
    0%  { transform:scale(1) rotate(0deg); }
    28% { transform:scale(1.18) rotate(-7deg); }
    58% { transform:scale(0.93) rotate(4deg); }
    78% { transform:scale(1.04) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0deg); }
}
.bouncing{ animation:pbounce 0.48s ease; }

@keyframes pdrown{
    0%  { transform:scale(1) rotate(0deg);                     opacity:1; }
    20% { transform:scale(1.05) rotate(3deg);                  opacity:1; }
    45% { transform:scale(0.9) rotate(-8deg) translateY(6px);  opacity:0.85; }
    70% { transform:scale(0.75) rotate(14deg) translateY(18px); opacity:0.45; }
    100%{ transform:scale(0.6) rotate(22deg) translateY(34px);  opacity:0; }
}
.drowning{ animation:pdrown 1.3s cubic-bezier(.5,0,.7,1) forwards; }

@keyframes psprout{
    0%  { transform:scale(0.2) translateY(20px); opacity:0; }
    40% { transform:scale(1.15) translateY(-4px); opacity:1; }
    65% { transform:scale(0.95) translateY(2px); }
    100%{ transform:scale(1) translateY(0);       opacity:1; }
}
.sprouting{ animation:psprout 1.1s cubic-bezier(.34,1.56,.64,1) forwards; }

.lf{ transition:opacity 0.65s ease; }

#plant-toast{
    position:fixed;
    z-index:400;
    bottom:112px;
    right:24px;
    left:auto;
    background:rgba(3,16,12,0.94);
    border:1px solid rgba(0,255,204,0.45);
    border-radius:14px;
    padding:9px 15px;
    color:#00ffcc;
    font-size:13px;
    line-height:1.5;
    text-align:center;
    white-space:nowrap;
    backdrop-filter:blur(16px);
    box-shadow:0 0 0 1px rgba(0,255,204,0.06),
               0 8px 28px rgba(0,0,0,0.55),
               0 0 20px rgba(0,255,204,0.12);
    opacity:0;
    pointer-events:none;
    transform:translateY(6px) scale(0.94);
    transition:opacity 0.28s, transform 0.28s;
}

#plant-toast.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

@media(max-width:600px){
    #plant-toast{
        position:absolute;
        top:auto;
        right:auto;
        left:50%;
        bottom:calc(100% + 10px);
        transform:translateX(-50%) translateY(6px) scale(0.94);
        font-size:13px;
        white-space:nowrap;
    }
    #plant-toast.show{
        transform:translateX(-50%) translateY(0) scale(1);
    }
}

#plant-toast strong{
    display:block;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.3px;
}

#plant-toast .tsub{
    color:rgba(0,255,204,0.65);
    font-size:11.5px;
}

.stage-pop{
    position:fixed;
    z-index:500;
    color:#00ffcc;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    pointer-events:none;
    text-shadow:0 0 8px #00ffcc;
    animation:stagefloat 1.2s ease forwards;
}

@keyframes stagefloat{
    0%  { opacity:0; transform:translateY(0) translateX(-50%); }
    15% { opacity:1; }
    70% { opacity:1; transform:translateY(-18px) translateX(-50%); }
    100%{ opacity:0; transform:translateY(-28px) translateX(-50%); }
}
</style>
</head>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue, get, remove, set, onDisconnect }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCAh2AsbxLqU2Gx9s0YbZo8PR4fpG3WDw8",
    authDomain:        "professorfilou-e8eea.firebaseapp.com",
    databaseURL:       "https://professorfilou-e8eea-default-rtdb.firebaseio.com",
    projectId:         "professorfilou-e8eea",
    storageBucket:     "professorfilou-e8eea.firebasestorage.app",
    messagingSenderId: "280418084891",
    appId:             "1:280418084891:web:1750e554b152810033f0be"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);


/* ═══════════════ BESUCHERZÄHLER ═══════════════ */
const SITE_BORN = new Date("2026-05-31T00:00:00");
const visitsRef = ref(db, "visits/total");
const visitEl   = document.getElementById("visit-count");

runTransaction(visitsRef, cur => (cur || 0) + 1);
onValue(visitsRef, snap => {
    visitEl.textContent = (snap.val() || 0).toLocaleString("de-DE");
});

function updateAge() {
    const days  = Math.floor((new Date() - SITE_BORN) / 86400000);
    const ageEl = document.getElementById("site-age");
    if      (days < 0)  ageEl.textContent = "bald";
    else if (days === 0) ageEl.textContent = "seit heute";
    else if (days === 1) ageEl.textContent = "1 Tag";
    else                 ageEl.textContent = days + " Tage";
}
updateAge();

function launchConfetti(amount = 80) {
    const layer = document.getElementById("confetti-layer");
    const colors = ["#00ffcc","#f06292","#fff176","#66bb6a","#42a5f5","#ffffff"];
    for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left             = Math.random() * 100 + "vw";
        piece.style.background       = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration= (2.5 + Math.random() * 2) + "s";
        piece.style.animationDelay   = (Math.random() * 0.6) + "s";
        layer.appendChild(piece);
        piece.addEventListener("animationend", () => piece.remove());
    }
}

const today = new Date();
if (today.getDate() === 31 && today.getMonth() === 4) {
    setTimeout(() => launchConfetti(160), 600);
    setTimeout(() => launchConfetti(160), 1800);
}


/* ═══════════════ LIVE PRESENCE ═══════════════ */
const sessionId    = Math.random().toString(36).slice(2);
const sessionRef   = ref(db, "presence/" + sessionId);
const connectedRef = ref(db, ".info/connected");
const presenceRef  = ref(db, "presence");

const dot          = document.getElementById("presence-dot");
const countEl      = document.getElementById("presence-count");
const widget       = document.getElementById("presence-fixed");

onValue(connectedRef, snap => {
    if (!snap.val()) return;
    onDisconnect(sessionRef).remove();
    set(sessionRef, { t: Date.now() });
});

onValue(presenceRef, snap => {
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;

    if (count <= 1) {
        countEl.textContent  = "nur du hier";
        dot.style.background = "#666";
        dot.style.animation  = "pulse-dim 2.5s ease infinite";
        widget.style.borderColor  = "rgba(255,255,255,0.08)";
        widget.style.boxShadow    = "none";
    } else if (count <= 3) {
        countEl.textContent  = count + " gerade hier";
        dot.style.background = "#00ffcc";
        dot.style.animation  = "pulse-green 1.8s ease infinite";
        widget.style.borderColor = "rgba(0,255,204,0.3)";
        widget.style.boxShadow   = "0 0 12px rgba(0,255,204,0.15)";
    } else {
        countEl.textContent  = count + " gerade hier 🔥";
        dot.style.background = "#00ffcc";
        dot.style.animation  = "pulse-green 0.9s ease infinite";
        widget.style.borderColor = "rgba(0,255,204,0.6)";
        widget.style.boxShadow   = "0 0 20px rgba(0,255,204,0.35)";
    }
});


/* ═══════════════ PFLANZE ═══════════════ */
function todayKey() {
    return "plant_" + new Date().toISOString().slice(0, 10);
}

const TODAY_KEY = todayKey();
const plantRef  = ref(db, "easter_egg/" + TODAY_KEY);

get(ref(db, "easter_egg")).then(snap => {
    if (!snap.exists()) return;
    snap.forEach(child => {
        if (child.key !== TODAY_KEY)
            remove(ref(db, "easter_egg/" + child.key)).catch(() => {});
    });
}).catch(() => {});

const hitDesktop = document.getElementById("hit-desktop");
const hitMobile  = document.getElementById("hit-mobile");
const toast      = document.getElementById("plant-toast");
const ptNum      = document.getElementById("pt-num");
const ptSub      = document.getElementById("pt-sub");
const stem       = document.getElementById("p-stem");
const flower     = document.getElementById("p-flower");
const lf         = id => document.getElementById(id);

const DROWN_AT = 100;
let waterCount  = 0;
let prevStage   = 0;
let cooling      = false;
let toastTimer  = null;
let everClicked = false;
let drownPlayed = false;

onValue(plantRef, snap => {
    const raw = snap.val() || 0;
    const atDrownPoint = raw > 0 && raw % DROWN_AT === 0;
    waterCount = raw % DROWN_AT;

    if (atDrownPoint && !drownPlayed) {
        drownPlayed = true;
        playDrownAndRebirth();
        if (everClicked) showToast(DROWN_AT);
        return;
    }
    if (!atDrownPoint) {
        drownPlayed = false;
        applyGrowth(waterCount);
    }
    if (everClicked) showToast(waterCount);
});

[hitDesktop, hitMobile].forEach(el => {
    el.addEventListener("click", () => {
        if (cooling) return;
        cooling = true;
        setTimeout(() => cooling = false, 700);
        everClicked = true;
        runTransaction(plantRef, cur => (cur || 0) + 1);
        spawnDrop(el);
        bounce(el);
    });
});

function stageOf(n) {
    if (n >= 85) return 4;
    if (n >= 55) return 3;
    if (n >= 25) return 2;
    return 1;
}

function applyGrowth(n) {
    const stage = stageOf(n);
    const s1 = Math.min(1, n / 24);
    lf("p-l1").setAttribute("opacity", 0.38 + s1 * 0.62);
    lf("p-l2").setAttribute("opacity", 0.38 + s1 * 0.62);
    const s2 = Math.max(0, Math.min(1, (n - 24) / 30));
    lf("p-l3").setAttribute("opacity", s2);
    lf("p-l4").setAttribute("opacity", s2);
    const s3 = Math.max(0, Math.min(1, (n - 54) / 30));
    lf("p-l5").setAttribute("opacity", s3);
    lf("p-l6").setAttribute("opacity", s3);
    if (n >= 55) stem.setAttribute("y2", "26");
    else         stem.setAttribute("y2", "40");
    const s4 = Math.max(0, Math.min(1, (n - 84) / 15));
    flower.setAttribute("opacity", s4);
    if (stage > prevStage && prevStage > 0) flashStage(stage);
    prevStage = stage;
}

function resetPlantVisual() {
    lf("p-l1").setAttribute("opacity", 0.42);
    lf("p-l2").setAttribute("opacity", 0.42);
    lf("p-l3").setAttribute("opacity", 0);
    lf("p-l4").setAttribute("opacity", 0);
    lf("p-l5").setAttribute("opacity", 0);
    lf("p-l6").setAttribute("opacity", 0);
    flower.setAttribute("opacity", 0);
    stem.setAttribute("y2", "40");
    prevStage = 1;
}

function playDrownAndRebirth() {
    [hitDesktop, hitMobile].forEach(el => {
        const svg = el.querySelector(".plant-svg");
        svg.classList.remove("bouncing", "sprouting");
        void svg.offsetWidth;
        svg.classList.add("drowning");
        svg.addEventListener("animationend", function onDrown() {
            svg.removeEventListener("animationend", onDrown);
            resetPlantVisual();
            svg.classList.remove("drowning");
            void svg.offsetWidth;
            svg.classList.add("sprouting");
            svg.addEventListener("animationend", function onSprout() {
                svg.removeEventListener("animationend", onSprout);
                svg.classList.remove("sprouting");
            }, { once:true });
        }, { once:true });
    });
    flashCustom("💀 ERTRUNKEN → 🌱 NEU!");
}

const stageText = { 2:"🌿 Neue Blätter!", 3:"🌱 Sie wächst!", 4:"🌸 Geblüht!" };

function flashStage(s) {
    if (!stageText[s]) return;
    flashCustom(stageText[s]);
}

function flashCustom(txt) {
    const isMobile = window.innerWidth <= 600;
    const anchor   = isMobile ? hitMobile : hitDesktop;
    const rect     = anchor.getBoundingClientRect();
    const el       = document.createElement("div");
    el.className   = "stage-pop";
    el.textContent = txt;
    el.style.left  = (rect.left + rect.width / 2) + "px";
    el.style.top   = (rect.top - 4) + "px";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
}

function showToast(n) {
    clearTimeout(toastTimer);
    ptNum.textContent = n + "×";
    let msg;
    if       (n >= 100) msg = "Sie ist ertrunken 💀🌊";
    else if (n >= 90)  msg = "Gleich zu viel… 😰💦";
    else if (n >= 80)  msg = "Voll aufgeblüht! 🌸";
    else if (n >= 70)  msg = "Wunderschön! 🌷";
    else if (n >= 60)  msg = "Sie blüht auf! 🌺";
    else if (n >= 50)  msg = "Halbzeit! 🌳";
    else if (n >= 40)  msg = "Wird groß! 🌲";
    else if (n >= 30)  msg = "Immer grüner! 🍃";
    else if (n >= 20)  msg = "Neue Blätter! 🌿";
    else if (n >= 10)  msg = "Sie wächst! 🌱";
    else               msg = "Heute gegossen 💧";
    ptSub.textContent = msg;

    if (window.innerWidth <= 600) {
        const inlineEl = document.getElementById("plant-inline");
        inlineEl.style.position = "relative";
        toast.style.position    = "absolute";
        if (toast.parentElement !== inlineEl) inlineEl.appendChild(toast);
    }

    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}

function spawnDrop(anchor) {
    const d       = document.createElement("div");
    d.className   = "wdrop";
    d.textContent = "💧";
    anchor.appendChild(d);
    d.addEventListener("animationend", () => d.remove());
}

function bounce(anchor) {
    const svg = anchor.querySelector(".plant-svg");
    if (svg.classList.contains("drowning") || svg.classList.contains("sprouting")) return;
    svg.classList.remove("bouncing");
    void svg.offsetWidth;
    svg.classList.add("bouncing");
    svg.addEventListener("animationend",
        () => svg.classList.remove("bouncing"), { once:true });
}


/* ═══════════════ LIVE GLÜHBIRNE ═══════════════ */
const bulbRef = ref(db, "live_features/light_bulb");
const bulbEl = document.getElementById("hit-bulb");
const bulbSvg = bulbEl.querySelector(".bulb-svg");

let currentBulbState = false;

onValue(bulbRef, (snap) => {
    currentBulbState = snap.val() === true;
    if (currentBulbState) {
        bulbSvg.classList.add("is-on");
    } else {
        bulbSvg.classList.remove("is-on");
    }
});

bulbEl.addEventListener("click", () => {
    bulbSvg.classList.remove("swinging");
    void bulbSvg.offsetWidth; 
    bulbSvg.classList.add("swinging");
    
    set(bulbRef, !currentBulbState);
});
</script>

<script>
const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() {
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x:  Math.random() * innerWidth,
        y:  Math.random() * innerHeight,
        r:  Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.45,
        dy: (Math.random() - 0.5) * 0.45,
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle   = "#00ffcc";
        ctx.shadowBlur  = 12;
        ctx.shadowColor = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
