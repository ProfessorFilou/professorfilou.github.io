<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProfessorFilou</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    overflow-x:hidden;
    color:white;
    min-height:100vh;
}

canvas{
    position:fixed;
    inset:0;
    z-index:-1;
}

.main{
    width:100%;
    min-height:100vh;

    padding:60px 18px;

    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

h1{
    font-size:clamp(52px, 10vw, 88px);

    letter-spacing:4px;

    text-shadow:
    0 0 10px #00ffcc,
    0 0 20px #00ffcc,
    0 0 40px #00ffcc;

    animation:glow 2s infinite alternate;

    word-break:break-word;
}

.line{
    width:min(320px, 80vw);
    height:2px;

    background:#00ffcc;

    margin:22px auto;

    box-shadow:0 0 15px #00ffcc;
}

.text{
    color:#bfbfbf;

    line-height:1.8;

    font-size:clamp(16px, 4vw, 22px);
}

.socials{
    margin-top:38px;

    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.social{
    width:74px;
    height:74px;

    border-radius:20px;

    background:rgba(255,255,255,0.05);

    display:flex;
    justify-content:center;
    align-items:center;

    border:1px solid rgba(255,255,255,0.08);

    transition:0.3s;
}

.social:hover{

    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 0 15px #00ffcc,
    0 0 35px rgba(0,255,204,0.5);
}

.social img{
    width:38px;
    height:38px;
}

.projects-title{

    margin-top:65px;

    font-size:clamp(26px, 6vw, 34px);

    color:#00ffcc;

    letter-spacing:2px;
}

.projects{

    margin-top:30px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit, minmax(170px, 1fr));

    gap:16px;

    width:min(1100px, 100%);
}

.project-btn{

    padding:18px 16px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    transition:0.3s;

    backdrop-filter:blur(8px);

    font-size:17px;

    overflow:hidden;
    text-overflow:ellipsis;
}

.project-btn:hover{

    transform:translateY(-5px);

    border-color:#00ffcc;

    box-shadow:
    0 0 15px #00ffcc,
    0 0 35px rgba(0,255,204,0.4);

    color:#00ffcc;
}

.footer{

    margin-top:55px;

    color:#666;

    font-size:14px;
}

@keyframes glow{

    from{

        text-shadow:
        0 0 10px #00ffcc,
        0 0 20px #00ffcc;
    }

    to{

        text-shadow:
        0 0 20px #00ffcc,
        0 0 40px #00ffcc,
        0 0 80px #00ffcc;
    }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="main">

    <h1>ProfessorFilou</h1>

    <div class="line"></div>

    <div class="text">
        13 y/o Dev <br>
        ❤️ Minecraft
    </div>

    <div class="socials">

        <a class="social"
        href="https://github.com/professorfilou"
        target="_blank">

            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg">

        </a>

        <a class="social"
        href="https://youtube.com/@professorfilou"
        target="_blank">

            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">

        </a>

        <a class="social"
        href="https://twitch.tv/professorfilou"
        target="_blank">

            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg">

        </a>

    </div>

    <div class="projects-title">
        My Projects
    </div>

    <div class="projects">

        <a class="project-btn" href="https://professorfilou.github.io/EmojiClick/" target="_blank">
            EmojiClick
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/DropDown/" target="_blank">
            DropDown
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/WhoAmIWeb/" target="_blank">
            WhoAmIWeb
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/WeatherWeb/" target="_blank">
            WeatherWeb
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/Tycoon/" target="_blank">
            Tycoon
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/finn.fun/" target="_blank">
            finn.fun
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/Lade/" target="_blank">
            Lade
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/Search/" target="_blank">
            Search
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/Quiz/" target="_blank">
            Quiz
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/FinnGPT/" target="_blank">
            FinnGPT
        </a>

        <a class="project-btn" href="https://professorfilou.github.io/OptischeTaeuschung/" target="_blank">
            OptischeTaeuschung
        </a>

    </div>

    <div class="footer">
        © ProfessorFilou
    </div>

</div>

<script>

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();

window.addEventListener("resize", resize);

const particles = [];

for(let i=0;i<140;i++){

    particles.push({

        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,

        r:Math.random()*2,

        dx:(Math.random()-0.5)*0.45,
        dy:(Math.random()-0.5)*0.45

    });
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(const p of particles){

        p.x += p.dx;
        p.y += p.dy;

        if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if(p.y < 0 || p.y > canvas.height) p.dy *= -1;

        ctx.beginPath();

        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

        ctx.fillStyle = "#00ffcc";

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00ffcc";

        ctx.fill();
    }

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
