<style>

*{
    margin:0;

body{
    background:#050505;

}

canvas{
    position:fixed;
    inset:0;
    z-index:-1;

.main{

    text-align:center;

h1{

    letter-spacing:clamp(1px,0.5vw,6px);
    text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc,0 0 40px #00ffcc;

}

.line{
    width:min(320px,75vw);
    height:2px;
    background:#00ffcc;
    margin:22px auto;
    box-shadow:0 0 15px #00ffcc;
}

.text{

}

.socials{
    margin-top:38px;
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.social{
    width:74px;
    height:74px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.social:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.5);
}

.social img{
    width:38px;
    height:38px;
    object-fit:contain;
}

.projects-title{
    margin-top:65px;
    font-size:clamp(26px,6vw,34px);
    color:#00ffcc;
    letter-spacing:2px;
}

.projects{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:16px;
    width:min(1100px,100%);
}

.project-btn{
    padding:18px 16px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
    backdrop-filter:blur(8px);
    font-size:17px;
}

.project-btn:hover{
    transform:translateY(-5px);
    border-color:#00ffcc;
    box-shadow:0 0 15px #00ffcc,0 0 35px rgba(0,255,204,0.4);
    color:#00ffcc;
}

.footer{
    margin-top:55px;
    color:#666;
    font-size:14px;
}

@keyframes glow{
    from{text-shadow:0 0 10px #00ffcc,0 0 20px #00ffcc;}
    to{text-shadow:0 0 20px #00ffcc,0 0 40px #00ffcc,0 0 80px #00ffcc;}
}

/* ════════════════════════════════
   PLANT EASTER EGG
   Desktop  → top-right fixed
   Mobile   → inline after footer
   ════════════════════════════════ */

/* The fixed desktop plant */
#plant-fixed {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Hide fixed plant on mobile */
@media (max-width: 600px) {
    #plant-fixed { display: none; }
}

/* The inline mobile plant (shown only on mobile) */
#plant-inline {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 28px;
}

@media (max-width: 600px) {
    #plant-inline { display: flex; }
}

/* Shared hit area */
.plant-hit {
    position: relative;
    width: 68px;
    height: 84px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.plant-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transition: filter 0.3s;
}

.plant-hit:hover .plant-svg,
.plant-hit:active .plant-svg {
    filter: drop-shadow(0 0 8px #00ffcc) drop-shadow(0 0 18px rgba(0,255,204,0.4));
}

/* water drop */
.wdrop {
    position: absolute;
    font-size: 18px;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    animation: wfall 0.72s cubic-bezier(.38,0,.62,1) forwards;
}

@keyframes wfall {
    0%   { opacity:1; top: 2px; }
    72%  { opacity:1; top: 70px; }
    100% { opacity:0; top: 80px; }
}

/* bounce */
@keyframes pbounce {
    0%   { transform:scale(1) rotate(0deg); }
    28%  { transform:scale(1.18) rotate(-7deg); }
    58%  { transform:scale(0.93) rotate(4deg); }
    78%  { transform:scale(1.04) rotate(-2deg); }
    100% { transform:scale(1) rotate(0deg); }
}
.bouncing { animation: pbounce 0.48s ease; }

/* leaf transitions */
.lf { transition: opacity 0.65s ease; }

/* ── Toast (floats above plant on desktop, above inline on mobile) ── */
#plant-toast {
    position: fixed;
    z-index: 400;

    /* desktop: right-aligned under fixed plant */
    top: 112px;
    right: 12px;
    left: auto;

    background: rgba(3,16,12,0.94);
    border: 1px solid rgba(0,255,204,0.45);
    border-radius: 14px;
    padding: 9px 15px;
    color: #00ffcc;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    white-space: nowrap;
    backdrop-filter: blur(16px);
    box-shadow:
        0 0 0 1px rgba(0,255,204,0.06),
        0 8px 28px rgba(0,0,0,0.55),
        0 0 20px rgba(0,255,204,0.12);

    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px) scale(0.94);
    transition: opacity 0.28s, transform 0.28s;
}

#plant-toast.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* On mobile, toast is absolute relative to #plant-inline */
@media (max-width: 600px) {
    #plant-toast {
        position: absolute;
        top: auto;
        right: auto;
        left: 50%;
        bottom: calc(100% + 10px);
        transform: translateX(-50%) translateY(6px) scale(0.94);
        font-size: 13px;
        white-space: nowrap;
    }
    #plant-toast.show {
        transform: translateX(-50%) translateY(0) scale(1);
    }
}

#plant-toast strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

#plant-toast .tsub {
    color: rgba(0,255,204,0.65);
    font-size: 11.5px;
}

/* stage pop label */
.stage-pop {
    position: fixed;
    z-index: 500;
    color: #00ffcc;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 8px #00ffcc;
    animation: stagefloat 1.2s ease forwards;
}

@keyframes stagefloat {
    0%   { opacity:0; transform:translateY(0) translateX(-50%); }
    15%  { opacity:1; }
    70%  { opacity:1; transform:translateY(-18px) translateX(-50%); }
    100% { opacity:0; transform:translateY(-28px) translateX(-50%); }
}

</style>

<!-- ══ FIREBASE ══ -->
<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
    apiKey:            "AIzaSyCAh2AsbxLqU2Gx9s0YbZo8PR4fpG3WDw8",
    authDomain:        "professorfilou-e8eea.firebaseapp.com",
    databaseURL:       "https://professorfilou-e8eea-default-rtdb.firebaseio.com",
    projectId:         "professorfilou-e8eea",
    storageBucket:     "professorfilou-e8eea.firebasestorage.app",
    messagingSenderId: "280418084891",
    appId:             "1:280418084891:web:1750e554b152810033f0be"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

function todayKey() {
    return "plant_" + new Date().toISOString().slice(0, 10);
}

const plantRef = ref(db, "easter_egg/" + todayKey());

/* DOM */
const hitDesktop = document.getElementById("hit-desktop");
const hitMobile  = document.getElementById("hit-mobile");
const toast      = document.getElementById("plant-toast");
const ptNum      = document.getElementById("pt-num");
const ptSub      = document.getElementById("pt-sub");
const stem       = document.getElementById("p-stem");
const flower     = document.getElementById("p-flower");

const lf = id => document.getElementById(id);

let waterCount = 0;
let prevStage  = 0;
let cooling    = false;
let toastTimer = null;
let everClicked = false;

/* ── Live Firebase ── */
onValue(plantRef, snap => {
    waterCount = snap.val() || 0;
    applyGrowth(waterCount);
    if (everClicked) showToast(waterCount);
});

/* ── Clicks on both hit areas ── */
[hitDesktop, hitMobile].forEach(el => {
    el.addEventListener("click", () => {
        if (cooling) return;
        cooling = true;
        setTimeout(() => cooling = false, 700);

        everClicked = true;
        runTransaction(plantRef, cur => (cur || 0) + 1);
        spawnDrop(el);
        bounce(el);
    });
});

/* ── Growth ── */
function stageOf(n) {
    if (n >= 20) return 4;
    if (n >= 12) return 3;
    if (n >= 5)  return 2;
    return 1;
}

function applyGrowth(n) {
    const stage = stageOf(n);

    const s1 = Math.min(1, n / 4);
    lf("p-l1").setAttribute("opacity", 0.38 + s1 * 0.62);
    lf("p-l2").setAttribute("opacity", 0.38 + s1 * 0.62);

    const s2 = Math.max(0, Math.min(1, (n - 4) / 7));
    lf("p-l3").setAttribute("opacity", s2);
    lf("p-l4").setAttribute("opacity", s2);

    const s3 = Math.max(0, Math.min(1, (n - 11) / 8));
    lf("p-l5").setAttribute("opacity", s3);
    lf("p-l6").setAttribute("opacity", s3);
    if (n >= 12) stem.setAttribute("y2", "26");

    const s4 = Math.max(0, Math.min(1, (n - 19) / 5));
    flower.setAttribute("opacity", s4);

    if (stage > prevStage && prevStage > 0) flashStage(stage);
    prevStage = stage;
}

const stageText = { 2:"🌿 Neue Blätter!", 3:"🌱 Sie wächst!", 4:"🌸 Geblüht!" };

function flashStage(s) {
    if (!stageText[s]) return;
    const isMobile = window.innerWidth <= 600;
    const anchor   = isMobile ? hitMobile : hitDesktop;
    const rect     = anchor.getBoundingClientRect();

    const el = document.createElement("div");
    el.className   = "stage-pop";
    el.textContent = stageText[s];
    el.style.left  = (rect.left + rect.width / 2) + "px";
    el.style.top   = (rect.top - 4) + "px";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
}

/* ── Toast ── */
function showToast(n) {
    clearTimeout(toastTimer);
    ptNum.textContent = n + "×";

    if      (n < 5)   ptSub.textContent = "heute gegossen 💧";
    else if (n < 15)  ptSub.textContent = "schon " + n + "× – danke! 🌿";
    else if (n < 30)  ptSub.textContent = "echter Pflanzenfan 🌳";
    else              ptSub.textContent = "sie ertrinkt fast 😭💦";

    /* On mobile: move toast to be above the inline plant */
    if (window.innerWidth <= 600) {
        const inlineEl = document.getElementById("plant-inline");
        inlineEl.style.position = "relative";
        toast.style.position    = "absolute";

        // re-attach toast inside inline wrapper so it positions relative to it
        if (toast.parentElement !== inlineEl) {
            inlineEl.appendChild(toast);
        }
    }

    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}

/* ── Drop ── */
function spawnDrop(anchor) {
    const d = document.createElement("div");
    d.className   = "wdrop";
    d.textContent = "💧";
    anchor.appendChild(d);
    d.addEventListener("animationend", () => d.remove());
}

/* ── Bounce ── */
function bounce(anchor) {
    const svg = anchor.querySelector(".plant-svg");
    svg.classList.remove("bouncing");
    void svg.offsetWidth;
    svg.classList.add("bouncing");
    svg.addEventListener("animationend",
        () => svg.classList.remove("bouncing"), { once: true });
}

</script>


<!-- ══ CANVAS ══ -->
<script>
const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");

function resize() {
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x:  Math.random() * innerWidth,
        y:  Math.random() * innerHeight,
        r:  Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.45,
        dy: (Math.random() - 0.5) * 0.45,
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle   = "#00ffcc";
        ctx.shadowBlur  = 12;
        ctx.shadowColor = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
