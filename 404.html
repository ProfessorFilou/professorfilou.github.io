<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – ProfessorFilou</title>
<link rel="icon" type="image/jpeg" href="ProfessorFilouLOGO.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#060810;
    --glass:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.09);
    --cyan:#00ffcc;
    --violet:#8b7bff;
    --blue:#2fd8ff;
    --pink:#ff6bcb;
    --text:#f2f5f9;
    --text-dim:#9099ac;
    --text-faint:#525a6a;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', Arial, Helvetica, sans-serif; }
a{ text-decoration:none !important; color:inherit; }
body{
    background:var(--bg);
    overflow-x:hidden;
    color:var(--text);
    min-height:100vh;
    cursor:default;
}
canvas{ position:fixed; inset:0; z-index:-2; }

/* ═══ HOLO ORB FIELD ═══ */
.orb-field{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; mix-blend-mode:screen; }
.orb-1{ width:46vw; height:46vw; left:-12vw; top:-16vw; background:radial-gradient(circle, var(--cyan), transparent 70%); animation:drift1 26s ease-in-out infinite; }
.orb-2{ width:40vw; height:40vw; right:-14vw; top:6vh; background:radial-gradient(circle, var(--violet), transparent 70%); animation:drift2 32s ease-in-out infinite; }
.orb-3{ width:42vw; height:42vw; left:18vw; bottom:-20vw; background:radial-gradient(circle, var(--blue), transparent 70%); animation:drift3 29s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6vw,8vh) scale(1.12); } }
@keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-7vw,6vh) scale(0.92); } }
@keyframes drift3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(4vw,-6vh) scale(1.08); } }

.main{
    width:100%;
    min-height:100vh;
    padding:40px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hourglass-wrap{ margin-bottom:20px; }
.hourglass-svg{
    width:clamp(52px, 9vw, 78px);
    height:clamp(52px, 9vw, 78px);
    overflow:visible;
    filter:drop-shadow(0 0 10px rgba(0,255,204,0.55)) drop-shadow(0 0 22px rgba(0,255,204,0.25));
    animation:rotateHourglass 5s cubic-bezier(0.65,0,0.35,1) infinite;
    transform-origin:50% 50%;
}
.hg-frame{ fill:none; stroke:var(--cyan); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; opacity:0.95; }
.hg-cap{ fill:rgba(0,255,204,0.18); stroke:var(--cyan); stroke-width:2; stroke-linecap:round; }
.hg-glass-fill{ fill:rgba(0,255,204,0.04); stroke:none; }
.sand-top{
    fill:url(#sandGradTop);
    animation:emptyTop 5s cubic-bezier(0.4,0,0.2,1) infinite;
    transform-origin:32px 22px;
}
.sand-bottom{
    fill:url(#sandGradBot);
    animation:fillBottom 5s cubic-bezier(0.4,0,0.2,1) infinite;
    transform-origin:32px 46px;
}
.sand-stream{
    stroke:var(--cyan);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-dasharray:2.5 3.5;
    animation:streamSand 0.45s linear infinite;
    filter:drop-shadow(0 0 3px var(--cyan));
}
.sand-grain{
    fill:var(--cyan);
    opacity:0;
    animation:grainFall 5s linear infinite;
}
.sand-grain:nth-child(1){ animation-delay:0.15s; }
.sand-grain:nth-child(2){ animation-delay:0.55s; }
.sand-grain:nth-child(3){ animation-delay:0.95s; }
.sand-grain:nth-child(4){ animation-delay:1.4s; }
.sand-grain:nth-child(5){ animation-delay:1.85s; }
.sand-grain:nth-child(6){ animation-delay:2.3s; }
@keyframes rotateHourglass{
    0%,78%{ transform:rotate(0deg); }
    88%{ transform:rotate(180deg); }
    100%{ transform:rotate(180deg); }
}
@keyframes emptyTop{
    0%{ transform:scaleY(1); opacity:1; }
    72%{ transform:scaleY(0.08); opacity:0.85; }
    78%,100%{ transform:scaleY(0); opacity:0; }
}
@keyframes fillBottom{
    0%{ transform:scaleY(0.05) translateY(6px); opacity:0.3; }
    8%{ opacity:1; }
    72%{ transform:scaleY(1) translateY(0); opacity:1; }
    78%,100%{ transform:scaleY(1) translateY(0); opacity:1; }
}
@keyframes streamSand{ to{ stroke-dashoffset:-12; } }
@keyframes grainFall{
    0%,5%{ opacity:0; transform:translateY(0); }
    12%{ opacity:0.9; }
    55%{ opacity:0.7; transform:translateY(14px); }
    70%,100%{ opacity:0; transform:translateY(18px); }
}

.error-code{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(76px, 20vw, 168px);
    letter-spacing:clamp(2px, 1vw, 10px);
    background:linear-gradient(100deg, var(--cyan) 0%, var(--blue) 40%, var(--violet) 75%, var(--pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:holoShift 6s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(0,255,204,0.25));
    line-height:0.9;
    margin-bottom:6px;
    user-select:none;
}
@keyframes holoShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }

h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(19px, 4.6vw, 29px);
    letter-spacing:0.3px;
    margin-top:12px;
    color:var(--text);
    font-weight:600;
    max-width:90%;
    line-height:1.3;
}

.line{
    width:min(140px,40vw);
    height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin:20px auto 22px;
}

.text{
    color:var(--text-dim);
    line-height:1.7;
    font-size:clamp(14px, 3.2vw, 17px);
    max-width:460px;
    margin-bottom:14px;
}
.text .hint{
    display:block;
    margin-top:8px;
    color:var(--text-faint);
    font-size:0.92em;
}

.countdown{
    color:var(--cyan);
    font-size:clamp(12.5px, 2.9vw, 14.5px);
    margin-bottom:34px;
    opacity:0.9;
    letter-spacing:0.3px;
}
.countdown span{ font-weight:700; font-size:1.15em; }

/* ═══ GLASS HOME BUTTON ═══ */
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:11px;
    padding:15px 32px;
    border-radius:16px;
    color:var(--text);
    background:var(--glass);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    transition:0.35s cubic-bezier(0.25,1,0.5,1);
    font-size:clamp(14.5px, 3.3vw, 16.5px);
    font-weight:600;
    letter-spacing:0.2px;
    cursor:pointer;
    position:relative;
}
.home-btn:hover{
    transform:translateY(-4px);
    border-color:rgba(0,255,204,0.5);
    color:var(--cyan);
    box-shadow:0 10px 30px rgba(0,255,204,0.16);
}
.home-btn:active{ transform:translateY(-1px) scale(0.98); }
.home-btn svg{ width:18px; height:18px; transition:transform 0.35s ease; }
.home-btn:hover svg{ transform:translateX(-4px); }

.footer{ margin-top:52px; color:var(--text-faint); font-size:12.5px; letter-spacing:0.5px; }

@media (prefers-reduced-motion: reduce){
    .orb, .error-code, .hourglass-svg{ animation:none !important; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="orb-field">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="main">
    <div class="hourglass-wrap">
        <svg class="hourglass-svg" viewBox="0 0 64 64">
            <defs>
                <linearGradient id="sandGradTop" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#7fffd4"/>
                    <stop offset="100%" stop-color="#00ffcc"/>
                </linearGradient>
                <linearGradient id="sandGradBot" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#00ffcc"/>
                    <stop offset="100%" stop-color="#00c9a0"/>
                </linearGradient>
            </defs>
            <rect class="hg-cap" x="14" y="5" width="36" height="5" rx="1.5"/>
            <rect class="hg-cap" x="14" y="54" width="36" height="5" rx="1.5"/>
            <path class="hg-frame" d="M18,10 L46,10 L46,14 C46,24 38,30 32,31 C26,30 18,24 18,14 Z"/>
            <path class="hg-frame" d="M18,54 L46,54 L46,50 C46,40 38,34 32,33 C26,34 18,40 18,50 Z"/>
            <path class="hg-glass-fill" d="M18,10 L46,10 L46,14 C46,24 38,30 32,31 C26,30 18,24 18,14 Z"/>
            <path class="hg-glass-fill" d="M18,54 L46,54 L46,50 C46,40 38,34 32,33 C26,34 18,40 18,50 Z"/>
            <line class="hg-frame" x1="17" y1="10" x2="17" y2="54" stroke-width="1.6" opacity="0.45"/>
            <line class="hg-frame" x1="47" y1="10" x2="47" y2="54" stroke-width="1.6" opacity="0.45"/>
            <path class="sand-top" d="M20,11 L44,11 C43.5,20 37,27 32,28.5 C27,27 20.5,20 20,11 Z"/>
            <path class="sand-bottom" d="M22,52 L42,52 C43,48 42,42 32,35.5 C22,42 21,48 22,52 Z"/>
            <line class="sand-stream" x1="32" y1="29" x2="32" y2="38"/>
            <circle class="sand-grain" cx="31.2" cy="30" r="0.9"/>
            <circle class="sand-grain" cx="32.8" cy="30" r="0.7"/>
            <circle class="sand-grain" cx="32" cy="30" r="0.8"/>
            <circle class="sand-grain" cx="31.5" cy="30" r="0.6"/>
            <circle class="sand-grain" cx="32.5" cy="30" r="0.75"/>
            <circle class="sand-grain" cx="32" cy="30" r="0.55"/>
        </svg>
    </div>

    <div class="error-code">404</div>
    <h1 id="random-title">Diese Seite wurde nicht gefunden</h1>
    <div class="line"></div>

    <div class="text">
        Diese Seite existiert nicht…
        <span class="hint">oder vielleicht in einem Paralleluniversum.</span>
    </div>

    <div class="countdown">
        Weiterleitung in <span id="countdown">5</span> Sekunden…
    </div>

    <a href="/" class="home-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="footer">© ProfessorFilou</div>
</div>

<script>
const titles = [
    "Diese Seite wurde nicht gefunden",
    "Seite existiert nicht",
    "404 – Block not found",
    "Hier ist nichts… wirklich nichts",
    "Vielleicht in einem Paralleluniversum",
    "Die Datei spielt Verstecken",
    "Seite hat sich verlaufen",
    "404 – Existenz verweigert",
    "Diese Seite lebt woanders",
    "Seite temporär in einer anderen Dimension"
];
document.getElementById("random-title").textContent = titles[Math.floor(Math.random() * titles.length)];

let seconds = 5;
const countdownEl = document.getElementById("countdown");
const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;
    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/";
    }
}, 1000);

/* ═══ PARTIKEL ═══ */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener("resize", resize);

const PARTICLE_COLORS = ["#00ffcc", "#2fd8ff", "#8b7bff"];
const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.8 + 0.3,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5,
        c: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)]
    });
}
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = 0.55;
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
