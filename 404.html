<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – ProfessorFilou</title>
<link rel="icon" type="image/jpeg" href="ProfessorFilouLOGO.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#060810;
    --glass:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.09);
    --cyan:#00ffcc;
    --violet:#8b7bff;
    --blue:#2fd8ff;
    --pink:#ff6bcb;
    --text:#f2f5f9;
    --text-dim:#9099ac;
    --text-faint:#525a6a;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', Arial, Helvetica, sans-serif; }
a{ text-decoration:none !important; color:inherit; }
body{
    background:var(--bg);
    overflow-x:hidden;
    color:var(--text);
    min-height:100vh;
    cursor:default;
}
canvas{ position:fixed; inset:0; z-index:-2; }

/* ═══ HOLO ORB FIELD ═══ */
.orb-field{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; mix-blend-mode:screen; }
.orb-1{ width:46vw; height:46vw; left:-12vw; top:-16vw; background:radial-gradient(circle, var(--cyan), transparent 70%); animation:drift1 26s ease-in-out infinite; }
.orb-2{ width:40vw; height:40vw; right:-14vw; top:6vh; background:radial-gradient(circle, var(--violet), transparent 70%); animation:drift2 32s ease-in-out infinite; }
.orb-3{ width:42vw; height:42vw; left:18vw; bottom:-20vw; background:radial-gradient(circle, var(--blue), transparent 70%); animation:drift3 29s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6vw,8vh) scale(1.12); } }
@keyframes drift2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-7vw,6vh) scale(0.92); } }
@keyframes drift3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(4vw,-6vh) scale(1.08); } }

.main{
    width:100%;
    min-height:100vh;
    padding:40px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hourglass-wrap{ margin-bottom:18px; }
.hourglass-svg{
    width:clamp(46px, 9vw, 62px);
    height:clamp(46px, 9vw, 62px);
    overflow:visible;
    filter:drop-shadow(0 0 10px var(--cyan));
    animation:rotateHourglass 4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
}
.hourglass-glass{ fill:none; stroke:var(--cyan); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.sand-top{ fill:var(--cyan); animation:emptyTop 4s ease-in-out infinite; transform-origin:32px 32px; }
.sand-bottom{ fill:var(--cyan); animation:fillBottom 4s ease-in-out infinite; transform-origin:32px 32px; }
.sand-stream{ stroke:var(--cyan); stroke-width:2; stroke-dasharray:4,4; animation:streamSand 0.5s linear infinite; }
@keyframes rotateHourglass{ 0%,80%{transform:rotate(0deg);} 90%,100%{transform:rotate(180deg);} }
@keyframes emptyTop{ 0%{transform:scaleY(1);} 75%,100%{transform:scaleY(0);} }
@keyframes fillBottom{ 0%{transform:translateY(18px) scaleY(0);} 75%,100%{transform:translateY(0) scaleY(1);} }
@keyframes streamSand{ to{ stroke-dashoffset:-8; } }

.error-code{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(76px, 20vw, 168px);
    letter-spacing:clamp(2px, 1vw, 10px);
    background:linear-gradient(100deg, var(--cyan) 0%, var(--blue) 40%, var(--violet) 75%, var(--pink) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:holoShift 6s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(0,255,204,0.25));
    line-height:0.9;
    margin-bottom:6px;
    user-select:none;
}
@keyframes holoShift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }

h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(19px, 4.6vw, 29px);
    letter-spacing:0.3px;
    margin-top:12px;
    color:var(--text);
    font-weight:600;
    max-width:90%;
    line-height:1.3;
}

.line{
    width:min(140px,40vw);
    height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin:20px auto 22px;
}

.text{
    color:var(--text-dim);
    line-height:1.7;
    font-size:clamp(14px, 3.2vw, 17px);
    max-width:440px;
    margin-bottom:14px;
}

.countdown{
    color:var(--cyan);
    font-size:clamp(12.5px, 2.9vw, 14.5px);
    margin-bottom:34px;
    opacity:0.9;
    letter-spacing:0.3px;
}
.countdown span{ font-weight:700; font-size:1.15em; }

/* ═══ GLASS HOME BUTTON ═══ */
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:11px;
    padding:15px 32px;
    border-radius:16px;
    color:var(--text);
    background:var(--glass);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);
    transition:0.35s cubic-bezier(0.25,1,0.5,1);
    font-size:clamp(14.5px, 3.3vw, 16.5px);
    font-weight:600;
    letter-spacing:0.2px;
    cursor:pointer;
    position:relative;
}
.home-btn:hover{
    transform:translateY(-4px);
    border-color:rgba(0,255,204,0.5);
    color:var(--cyan);
    box-shadow:0 10px 30px rgba(0,255,204,0.16);
}
.home-btn:active{ transform:translateY(-1px) scale(0.98); }
.home-btn svg{ width:18px; height:18px; transition:transform 0.35s ease; }
.home-btn:hover svg{ transform:translateX(-4px); }

.footer{ margin-top:52px; color:var(--text-faint); font-size:12.5px; letter-spacing:0.5px; }

@media (prefers-reduced-motion: reduce){
    .orb, .error-code, .hourglass-svg{ animation:none !important; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="orb-field">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="main">
    <div class="hourglass-wrap">
        <svg class="hourglass-svg" viewBox="0 0 64 64">
            <path class="hourglass-glass" d="M16,8 L48,8 L48,16 C48,26 38,32 32,32 C26,32 16,26 16,16 Z" />
            <path class="hourglass-glass" d="M16,56 L48,56 L48,48 C48,38 38,32 32,32 C26,32 16,38 16,48 Z" />
            <line class="hourglass-glass" x1="12" y1="8" x2="52" y2="8" />
            <line class="hourglass-glass" x1="12" y1="56" x2="52" y2="56" />
            <path class="sand-top" d="M18,16 L46,16 C44,24 36,29 32,30 C28,29 20,24 18,16 Z" />
            <path class="sand-bottom" d="M20,48 L44,48 C46,51 46,54 46,54 L18,54 C18,54 18,51 20,48 Z" />
            <line class="sand-stream" x1="32" y1="30" x2="32" y2="50" />
        </svg>
    </div>

    <div class="error-code">404</div>
    <h1 id="random-title">Datei hat sich versteckt</h1>
    <div class="line"></div>

    <div class="text">
        Diese Seite existiert nicht<br>
        oder die URL wurde falsch eingegeben.
    </div>

    <div class="countdown">
        Weiterleitung in <span id="countdown">5</span> Sekunden…
    </div>

    <a href="/" class="home-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="footer">© ProfessorFilou</div>
</div>

<script>
const titles = [
    "Datei hat sich versteckt",
    "Diese Seite lebt in einer Parallelwelt",
    "404 – Block not found",
    "Die Seite ist auf Abenteuer",
    "Hier ist nichts… wirklich nichts",
    "Fehler 404: Intelligenz nicht gefunden",
    "Diese Seite wurde von einem Creeper gefressen",
    "Seite hat sich verlaufen",
    "404 – Existenz verweigert",
    "Die Datei spielt Verstecken",
    "Seite temporär in einer anderen Dimension",
    "Hier war mal was… jetzt nicht mehr"
];
document.getElementById("random-title").textContent = titles[Math.floor(Math.random() * titles.length)];

let seconds = 5;
const countdownEl = document.getElementById("countdown");
const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;
    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/";
    }
}, 1000);

/* ═══ PARTIKEL ═══ */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener("resize", resize);

const PARTICLE_COLORS = ["#00ffcc", "#2fd8ff", "#8b7bff"];
const particles = [];
for (let i = 0; i < 140; i++) {
    particles.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.8 + 0.3,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5,
        c: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)]
    });
}
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = 0.55;
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}m
animate();
</script>
</body>
</html>
