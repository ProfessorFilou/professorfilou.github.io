<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – ProfessorFilou</title>
<link rel="icon" type="image/jpeg" href="ProfessorFilouLOGO.jpg">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
a {
    text-decoration: none !important;
    color: inherit;
}
body{
    background:#050505;
    overflow-x:hidden;
    color:white;
    min-height:100vh;
    cursor: default;
}
canvas{
    position:fixed;
    inset:0;
    z-index:-1;
}
.main{
    width:100%;
    min-height:100vh;
    padding:40px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.error-code{
    font-size:clamp(80px, 22vw, 180px);
    font-weight:900;
    letter-spacing:clamp(4px, 1.5vw, 16px);
    color:#00ffcc;
    text-shadow:
        0 0 15px #00ffcc,
        0 0 35px #00ffcc,
        0 0 70px rgba(0,255,204,0.7),
        0 0 120px rgba(0,255,204,0.35);
    animation: glowPulse 2.6s ease-in-out infinite alternate;
    line-height:0.9;
    margin-bottom: 4px;
    user-select: none;
}

h1{
    font-size:clamp(20px, 5vw, 32px);
    letter-spacing:1px;
    margin-top: 14px;
    color: #fff;
    text-shadow: 0 0 18px rgba(0,255,204,0.45);
    font-weight: 600;
    max-width: 90%;
    line-height: 1.3;
}

.line{
    width:min(140px,40vw);
    height:2px;
    background:#00ffcc;
    margin:20px auto 24px;
    box-shadow:0 0 18px #00ffcc;
    border-radius: 2px;
}

.text{
    color:#a8a8a8;
    line-height:1.7;
    font-size:clamp(14px, 3.3vw, 17px);
    max-width: 440px;
    margin-bottom: 16px;
}

.countdown{
    color:#00ffcc;
    font-size:clamp(13px, 3vw, 15px);
    margin-bottom: 36px;
    opacity: 0.9;
    letter-spacing: 0.3px;
}
.countdown span{
    font-weight: 700;
    font-size: 1.15em;
}

/* Button */
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:16px 34px;
    border-radius:16px;
    color:white;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,255,204,0.32);
    transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    backdrop-filter:blur(10px);
    font-size:clamp(15px, 3.4vw, 17px);
    font-weight:600;
    letter-spacing: 0.3px;
    box-shadow: 
        0 0 14px rgba(0,255,204,0.22), 
        0 0 35px rgba(0,255,204,0.12);
    cursor: pointer;
    position: relative;
    overflow: hidden;
}
.home-btn:hover{
    transform:translateY(-5px) scale(1.04);
    border-color:#00ffcc;
    color:#00ffcc;
    box-shadow:
        0 0 22px #00ffcc,
        0 0 50px rgba(0,255,204,0.45);
}
.home-btn:active{
    transform:translateY(-2px) scale(0.98);
}
.home-btn svg{
    width:19px;
    height:19px;
    transition: transform 0.35s ease;
}
.home-btn:hover svg{
    transform: translateX(-4px);
}

.footer{
    margin-top:56px;
    color:#444;
    font-size:13px;
    letter-spacing:0.6px;
}

/* Hourglass */
.hourglass-wrap{
    margin-bottom: 14px;
}
.hourglass-svg{
    width: clamp(48px, 10vw, 68px);
    height: clamp(48px, 10vw, 68px);
    overflow: visible;
    filter: drop-shadow(0 0 12px #00ffcc);
    animation: rotateHourglass 4s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
}
.hourglass-glass{
    fill: none;
    stroke: #00ffcc;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.sand-top{
    fill: #00ffcc;
    animation: emptyTop 4s ease-in-out infinite;
    transform-origin: 32px 32px;
}
.sand-bottom{
    fill: #00ffcc;
    animation: fillBottom 4s ease-in-out infinite;
    transform-origin: 32px 32px;
}
.sand-stream{
    stroke: #00ffcc;
    stroke-width: 2;
    stroke-dasharray: 4, 4;
    animation: streamSand 0.5s linear infinite;
}

@keyframes glowPulse{
    from{ text-shadow:0 0 12px #00ffcc,0 0 25px #00ffcc,0 0 50px rgba(0,255,204,0.5); }
    to{ text-shadow:0 0 20px #00ffcc,0 0 45px #00ffcc,0 0 90px rgba(0,255,204,0.8),0 0 140px rgba(0,255,204,0.35); }
}
@keyframes rotateHourglass{
    0%, 80% { transform: rotate(0deg); }
    90%, 100% { transform: rotate(180deg); }
}
@keyframes emptyTop{
    0% { transform: scaleY(1); }
    75%, 100% { transform: scaleY(0); }
}
@keyframes fillBottom{
    0% { transform: translateY(18px) scaleY(0); }
    75%, 100% { transform: translateY(0) scaleY(1); }
}
@keyframes streamSand{
    to { stroke-dashoffset: -8; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="main">

    <div class="hourglass-wrap">
        <svg class="hourglass-svg" viewBox="0 0 64 64">
            <path class="hourglass-glass" d="M16,8 L48,8 L48,16 C48,26 38,32 32,32 C26,32 16,26 16,16 Z" />
            <path class="hourglass-glass" d="M16,56 L48,56 L48,48 C48,38 38,32 32,32 C26,32 16,38 16,48 Z" />
            <line class="hourglass-glass" x1="12" y1="8" x2="52" y2="8" />
            <line class="hourglass-glass" x1="12" y1="56" x2="52" y2="56" />
            <path class="sand-top" d="M18,16 L46,16 C44,24 36,29 32,30 C28,29 20,24 18,16 Z" />
            <path class="sand-bottom" d="M20,48 L44,48 C46,51 46,54 46,54 L18,54 C18,54 18,51 20,48 Z" />
            <line class="sand-stream" x1="32" y1="30" x2="32" y2="50" />
        </svg>
    </div>

    <div class="error-code">404</div>
    
    <!-- Zufälliger lustiger Titel -->
    <h1 id="random-title">Datei hat sich versteckt</h1>
    
    <div class="line"></div>

    <div class="text">
        Diese Seite existiert nicht<br>
        oder die URL wurde falsch eingegeben.
    </div>

    <div class="countdown">
        Weiterleitung in <span id="countdown">5</span> Sekunden…
    </div>

    <a href="/" class="home-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Zurück zur Startseite
    </a>

    <div class="footer">© ProfessorFilou</div>
</div>

<script>
/* ════ ZUFÄLLIGE LUSTIGE TEXTE ════ */
const titles = [
    "Datei hat sich versteckt",
    "Diese Seite lebt in einer Parallelwelt",
    "404 – Block not found",
    "Die Seite ist auf Abenteuer",
    "Hier ist nichts… wirklich nichts",
    "Fehler 404: Intelligenz nicht gefunden",
    "Diese Seite wurde von einem Creeper gefressen",
    "Seite hat sich verlaufen",
    "404 – Existenz verweigert",
    "Die Datei spielt Verstecken",
    "Seite temporär in einer anderen Dimension",
    "Hier war mal was… jetzt nicht mehr"
];

document.getElementById("random-title").textContent = 
    titles[Math.floor(Math.random() * titles.length)];

/* ════ COUNTDOWN + AUTO REDIRECT ════ */
let seconds = 5;
const countdownEl = document.getElementById("countdown");

const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/";
    }
}, 1000);

/* ════ PARTIKEL ════ */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

const particles = [];
for (let i = 0; i < 180; i++) {
    particles.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 2.3,
        dx: (Math.random() - 0.5) * 0.55,
        dy: (Math.random() - 0.5) * 0.55
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "#00ffcc";
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
